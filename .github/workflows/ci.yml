name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  pio-deps:
    name: PlatformIO dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/tools
            ~/.platformio/penv
            ~/.cache/pip
            examples/all_interfaces/.pio/libdeps
          key: pio-${{ hashFiles('examples/all_interfaces/platformio.ini') }}
          restore-keys: pio-

      - name: Setup Python
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install PlatformIO
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Install PlatformIO package dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: examples/all_interfaces
        run: |
          for env in esp32s3 pico; do
            echo "Installing dependencies for: $env"
            pio pkg install -e "$env"
          done

  pio-build:
    name: PlatformIO ${{ matrix.env }}
    runs-on: ubuntu-latest
    needs: [pio-deps]
    strategy:
      matrix:
        env: [esp32s3, pico]
    steps:
      - uses: actions/checkout@v4

      - name: Restore PlatformIO cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/tools
            ~/.platformio/penv
            ~/.cache/pip
            examples/all_interfaces/.pio/libdeps
          key: pio-${{ hashFiles('examples/all_interfaces/platformio.ini') }}
          restore-keys: pio-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build
        run: pio run -e ${{ matrix.env }} -d examples/all_interfaces

  integration-tests:
    name: Integration tests (simulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: embedded-menu

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/embedded-bridge
          path: embedded-bridge

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: embedded-menu/tests/integration
        run: |
          python -m venv .venv
          .venv/bin/pip install -e . -e ../../../embedded-bridge/python

      - name: Run integration tests
        working-directory: embedded-menu/tests/integration
        run: .venv/bin/pytest test_json_commands.py -v

  spa-tests:
    name: SPA browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: tests/integration
        run: |
          python -m venv .venv
          .venv/bin/pip install -e .
          .venv/bin/playwright install chromium --with-deps

      - name: Run SPA tests
        working-directory: tests/integration
        run: .venv/bin/pytest test_spa.py -v
